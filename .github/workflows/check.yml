name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.1.0
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh fish shellcheck
      - if: runner.os == 'macOS'
        run: brew install fish shellcheck
      - run: python3 -m unittest discover
      - run: uvx ruff check
      - run: uvx ruff format --check

  readme-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install -e .
      - run: sh demo/capture.sh
      - run: git diff --exit-code README.md

  claude-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install -e .
      - run: |
          npm install --prefix "$RUNNER_TEMP/claude" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/claude/node_modules/.bin" >> "$GITHUB_PATH"
      - run: sh tests/e2e/claude.sh

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
