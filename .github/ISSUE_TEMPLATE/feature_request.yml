name: Feature request
description: Propose a change to pentimento's behavior or CLI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do that pentimento doesn't support today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to see, and why it fits pentimento's scope (status/intent/lineage over plan files, stdlib-only, zero runtime dependencies).
    validations:
      required: true
