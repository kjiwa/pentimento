[project]
name = "pentimento"
version = "0.1.17"
description = "Derives status and lineage for the plan files Claude Code and Cursor leave behind, with a CLI to list, filter, and render them as a tree."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kamil Jiwa", email = "kamil.jiwa@gmail.com" }]
keywords = ["plans", "claude-code", "cursor", "cli", "lineage", "agent", "markdown", "frontmatter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kjiwa/pentimento"
Repository = "https://github.com/kjiwa/pentimento"
Issues = "https://github.com/kjiwa/pentimento/issues"

[project.scripts]
pentimento = "pentimento.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pentimento*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
