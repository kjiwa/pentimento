name: Bug report
description: Something in pentimento doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pentimento version
      description: Output of `pentimento --version`.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Plan source
      options:
        - Claude Code
        - Cursor
        - Other/unknown
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A command and, if you can share it, a minimal plan file that triggers the bug.
    validations:
      required: false
